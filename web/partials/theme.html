<script>
      /* Light unless the visitor chose dark; set before first paint so the page never flashes. */
      (function () {
        var t = "light";
        try {
          if (localStorage.getItem("ah-theme") === "dark") t = "dark";
        } catch (e) {}
        var d = document.documentElement;
        d.dataset.theme = t;
        d.classList.add("js");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#121212" : "#fbfbf9");
      })();
    </script>
